name: Vector CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  quality_gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap Workspace
        run: melos bootstrap

      - name: Static Analysis (All Packages)
        run: melos run analyze
      
      - name: Verify Formatting (Indentation)
        run: melos run format-check
      
      - name: Unit & Widget Tests
        run: melos run test --no-select


  build_android:
    needs: quality_gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
      
      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Build Vector Release APK
        run: |
          cd apps/vector
          flutter build apk --release --tree-shake-icons

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vector-android-release
          path: apps/vector/build/app/outputs/flutter-apk/app-release.apk